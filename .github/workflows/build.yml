name: Build MobileDumper-7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android NDK r27
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build arm64 executable
        run: |
          chmod +x build.sh
          ./build.sh --platform android --target exe --build release --arch arm64

      - name: Show binary location
        run: |
          ls -la builds/android/exe/release/arm64/ || true
          file builds/android/exe/release/arm64/MobileDumper-7 || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: MobileDumper-7-arm64
          path: builds/android/exe/release/arm64/MobileDumper-7
          if-no-files-found: error
          retention-days: 30
